project_id = "fetchgensan"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["fetchgensan://", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Matches PASSWORD_MIN_LENGTH in supabase/functions/_shared/identifier.ts,
# which checks first and explains itself better; this is the backstop for
# anything that reaches Auth directly.
minimum_password_length = 8
# Public sign-up is OFF until the apps have a sign-up screen. Accounts are
# created by staff in the console (supabase/functions/admin-users), which
# uses the Admin API and is unaffected by this switch. Turning it on later
# re-opens phone sign-up; email sign-up stays closed by enable_confirmations
# below unless that changes too.
enable_signup = false
enable_anonymous_sign_ins = false

# The email PROVIDER must be on for staff to sign in with an email and
# password -- in the CLI, `enable_signup = false` here disables email logins
# altogether, not just sign-ups. Sign-ups are governed by [auth] above, and
# confirmations stay on so an email address can never be claimed without
# access to its inbox; staff accounts are created already confirmed.
[auth.email]
enable_signup = true
enable_confirmations = true
# Staff sign in with email; reset codes are typed into the app, not
# clicked, so the recovery email carries the 6-digit code.
otp_length = 6

[auth.email.template.recovery]
subject = "Your FetchGensan password reset code"
content_path = "./supabase/templates/recovery.html"

# Phone OTP is the primary and effectively only sign-in path.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "FetchGensan code: {{ .Code }}. Do not share this with anyone."

# Local development: any code is accepted for these numbers, so you can run
# the whole flow without paying for SMS.
[auth.sms.test_otp]
"639170000001" = "123456"
"639170000002" = "123456"
"639170000003" = "123456"
"639170000004" = "123456"
"639170000005" = "123456"

# LOCAL ONLY -- these credentials are deliberately fake.
#
# The CLI logs "no SMS provider is enabled. Disabling phone login" and turns
# phone auth off completely unless a provider is flagged enabled, and
# [auth.sms.test_otp] on its own does not satisfy that check. Since every
# number in test_otp short-circuits before any network call is made, these
# values are never sent anywhere.
#
# In production, swap this for a real provider. Semaphore and Movider are
# the usual choices in the Philippines -- both are cheaper per SMS for PH
# numbers than Twilio and both support sender-name registration.
[auth.sms.twilio]
enabled = true
account_sid = "local-dev-unused"
message_service_sid = "local-dev-unused"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.dispatch-tick]
verify_jwt = false

[functions.push-notify]
verify_jwt = false

# Nobody calling sign-in or password reset has a session yet.
[functions.auth]
verify_jwt = false

# Verifies the caller itself (admin.auth.getUser) and then asks the database
# what they may do, so the gateway check would only duplicate that.
[functions.admin-users]
verify_jwt = false
